<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Game</title>
    <!-- Подключаем SDK Telegram для интеграции с мессенджером -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Контейнер для страниц */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: scale(0.95);
        }

        /* Класс для активной страницы */
        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Стилизация заголовков */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* Стильная кнопка */
        .btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #2488ff, #0057b8);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 87, 184, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        /* Эффект нажатия */
        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 87, 184, 0.2);
        }

        /* Красная кнопка для возврата назад */
        .btn-back {
            background: linear-gradient(135deg, #ff4d4d, #c40000);
            box-shadow: 0 4px 15px rgba(196, 0, 0, 0.4);
        }

        .btn-back:active {
            box-shadow: 0 2px 8px rgba(196, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- ПЕРВАЯ СТРАНИЦА -->
    <div id="page1" class="page active">
        <h1>Главный экран</h1>
        <button class="btn" onclick="navigateTo('page2')">Вперед</button>
    </div>

    <!-- ВТОРАЯ СТРАНИЦА -->
    <div id="page2" class="page">
        <h1>Второй экран</h1>
        <button class="btn btn-back" onclick="navigateTo('page1')">Назад</button>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand(); // Разворачиваем приложение на весь экран телефона
        }

        // Функция переключения страниц
        function navigateTo(pageId) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Показываем нужную страницу
            document.getElementById(pageId).classList.add('active');

            // Добавляем легкую вибрацию на смартфонах при клике
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
</body>
</html>
